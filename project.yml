name: Carafe
options:
  bundleIdPrefix: com.sebdubuy
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Carafe:
    type: application
    platform: macOS
    sources:
      - path: Carafe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebdubuy.Carafe
        PRODUCT_NAME: Carafe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Carafe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES

  CarafeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CarafeTests
    dependencies:
      - target: Carafe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebdubuy.CarafeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Carafe.app/Contents/MacOS/Carafe"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Carafe:
    build:
      targets:
        Carafe: all
        CarafeTests: [test]
    test:
      targets:
        - CarafeTests

name: Glouglou
options:
  bundleIdPrefix: com.sebdubuy
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Glouglou:
    type: application
    platform: macOS
    sources:
      - path: Glouglou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebdubuy.Glouglou
        PRODUCT_NAME: Glouglou
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glouglou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES

  GlouglouTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GlouglouTests
    dependencies:
      - target: Glouglou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebdubuy.GlouglouTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Glouglou.app/Contents/MacOS/Glouglou"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Glouglou:
    build:
      targets:
        Glouglou: all
        GlouglouTests: [test]
    test:
      targets:
        - GlouglouTests
